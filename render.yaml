services:
  - type: web
    name: antigravity-bot
    runtime: node
    buildCommand: npm install
    startCommand: node cloud_bot.js
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: GROQ_KEY
        sync: false
      - key: OPENROUTER_KEY
        sync: false
